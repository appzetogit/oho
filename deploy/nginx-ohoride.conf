# Paste into CloudPanel -> Sites -> ohoride.in -> Vhost
# Keep CloudPanel's generated server{}, listen and ssl_* lines.
# Replace the Laravel root + location blocks with everything below.
# Delete the old "location ~ \.php$" / php-fpm block - nothing is PHP any more.

root /home/ohoridein/apps/oho/frontend/dist;
index index.html;

# SPA: every unknown path returns the React shell, not a 404
location / {
    try_files $uri $uri/ /index.html;
}

# Hashed build assets are immutable
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://127.0.0.1:5000/health;
    proxy_set_header Host $host;
}

# Websockets - ride matching dies without the Upgrade headers
location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
